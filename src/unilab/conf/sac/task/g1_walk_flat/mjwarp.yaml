# @package _global_
# Configured-only SAC mjwarp owner for the unified host contract adapter. Keeps
# DENYLIST parity with the MuJoCo owner plus the mjwarp capacity knobs; legacy
# kp/kd randomization is disabled. Offline record reuses MuJoCo rendering;
# interactive eval routes through the MuJoCo viewer; native playback and
# device-resident runtime are intentionally absent.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mjwarp
  play_render_mode: record
algo:
  num_envs: 2048
  learning_starts: 10
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  algo_params:
    alpha_init: 0.001
    target_entropy_ratio: 0.0
  g1_walk_pack:
    _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPackCfg
    func: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPack
    weight: 0.0
    command_name: twist
    entity_name: robot
    tracking_lin_sigma: 0.25
    tracking_ang_sigma: 0.25
    gait_frequency: 1.5
    gait_init_mode: offset_phase
    swing_height: 0.09
    feet_phase_sigma: 0.04
    min_forward_speed: 0.0
    pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
    reward_pack_names:
      - tracking_lin_vel
      - tracking_ang_vel
      - penalty_ang_vel_xy
      - penalty_orientation
      - penalty_action_rate
      - pose
      - penalty_feet_ori
      - feet_phase
      - alive
env:
  # MJWarp is DEVICE_RESIDENT/DIRECT. The owner, not the caller, selects the
  # tensor runtime; collector and learner share the rank-local CUDA device.
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  render_spacing: 2.0
  reset_owners:
    walk:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwnerCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwner
      command_name: twist
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default_tensor
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_tensor
    # Legacy mjwarp owners disable kp/kd and armature randomization.
    pd_gains: null
