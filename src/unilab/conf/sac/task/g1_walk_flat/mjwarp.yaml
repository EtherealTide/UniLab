# @package _global_
# Configured-only SAC mjwarp owner for the unified host contract adapter. Keeps
# DENYLIST parity with the MuJoCo owner plus the mjwarp capacity knobs; legacy
# kp/kd randomization is disabled. Offline record reuses MuJoCo rendering;
# interactive eval routes through the MuJoCo viewer; native playback and
# device-resident runtime are intentionally absent.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mjwarp
  play_render_mode: record
algo:
  num_envs: 2048
  learning_starts: 10
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  algo_params:
    alpha_init: 0.001
    target_entropy_ratio: 0.0
env:
  # MJWarp is DEVICE_RESIDENT/DIRECT. The owner, not the caller, selects the
  # tensor runtime; collector and learner share the rank-local CUDA device.
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  render_spacing: 2.0
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default_tensor
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_tensor
    # Legacy mjwarp owners disable kp/kd and armature randomization.
    pd_gains: null
