# @package _global_
# Motrix mirrors the MuJoCo WBT training DR within its supported capability
# set. Root velocity pushes are unsupported by Motrix and stay disabled.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: G1MotionTrackingSAC
  sim_backend: motrix
env:
  events:
    push_robot: null
