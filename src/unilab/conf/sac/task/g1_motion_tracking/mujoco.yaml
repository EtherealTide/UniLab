# @package _global_
# MuJoCo owner for G1 WBT with FastSAC. Hyperparameters are aligned with
# holosoma g1-29dof-wbt-fast-sac; model-field DR follows mjlab Motion Imitation.
defaults:
  - /task/g1_motion_tracking/base
  - _self_

training:
  task_name: G1MotionTrackingSAC
  sim_backend: mujoco

algo:
  num_envs: 2048
  max_iterations: 25000
  save_interval: 1000
  gamma: 0.99
  tau: 0.05
  num_atoms: 501
  updates_per_step: 4
  policy_frequency: 2
  algo_params:
    alpha_init: 0.1
    target_entropy_ratio: 0.5
    max_grad_norm: 10.0

env:
  # mjlab fixes model-field biases at startup. UniLab model-field writes are
  # reset-transaction capabilities, so those terms use reset mode here.
  events:
    base_com:
      func: unilab.envs.mdp.randomize_rigid_body_com
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: torso_link
        com_range:
          x: [-0.025, 0.025]
          y: [-0.05, 0.05]
          z: [-0.05, 0.05]
    encoder_bias:
      func: unilab.envs.mdp.randomize_encoder_bias
      mode: reset
      params:
        bias_range: [-0.01, 0.01]
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          joint_names: ".*"
    foot_friction:
      func: unilab.envs.mdp.geom_friction
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          geom_names: "^(left|right)_foot[1-7]_collision$"
        ranges: [0.3, 1.2]
        operation: abs
        shared_random: true
    push_robot:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [1.0, 3.0]
      is_global_time: true
      params:
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.2, 0.2]
          roll: [-0.52, 0.52]
          pitch: [-0.52, 0.52]
          yaw: [-0.78, 0.78]
