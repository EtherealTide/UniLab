# @package _global_
# Stewart-platform ball-balancing (mujoco). A short, runnable PPO baseline, not
# tuned for best final performance. NOTE: the MuJoCo closed-loop solver is not
# yet training-stable for this stiff parallel mechanism under load (see
# balance.py); this owner exists so the task is selectable and steppable on the
# canonical production host-bridge backend.
defaults:
  - /task/stewart_balance/base
  - _self_

training:
  task_name: StewartBalance
  sim_backend: mujoco
algo:
  num_envs: 128
  num_steps_per_env: 64
  max_iterations: 400
  obs_groups:
    actor: [policy]
    critic: [policy]
  actor:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [128, 128]
    activation: tanh
    obs_normalization: true
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 0.3
      std_type: scalar
  critic:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [128, 128]
    activation: tanh
    obs_normalization: true
  algorithm:
    learning_rate: 1.0e-4
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.15
    entropy_coef: 1.0e-4
    value_loss_coef: 1.0
    desired_kl: 0.012
    max_grad_norm: 0.5
    gamma: 0.99
    lam: 0.95
  save_interval: 50
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
