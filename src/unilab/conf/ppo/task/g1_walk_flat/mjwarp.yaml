# @package _global_
# Configured-only mjwarp owner for the unified host contract adapter. Keeps
# DENYLIST parity with the MuJoCo owner; kp/kd randomization stays disabled,
# matching the tuned walk baseline.
# Offline record reuses MuJoCo rendering; interactive eval routes through the
# MuJoCo viewer (mjwarp physics, single env). Native playback and
# device-resident runtime routing are intentionally absent.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mjwarp
  play_render_mode: record
algo:
  num_envs: 2048
  max_iterations: 2200
  obs_groups:
    actor:
      - actor
env:
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default_tensor
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_tensor
    # kp/kd and armature randomization stay disabled, matching the tuned walk baseline.
    pd_gains: null
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
