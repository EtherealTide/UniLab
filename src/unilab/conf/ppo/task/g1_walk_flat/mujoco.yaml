# @package _global_
# MuJoCo owner: inherits the shared 29-DoF flat Manager-Based contract from
# base.yaml and only carries backend/algo identity.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mujoco
algo:
  num_envs: 2048
  max_iterations: 2200
  obs_groups:
    actor:
      - actor
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
env:
  reset_owners:
    walk:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwnerCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwner
      command_name: twist
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.skip_scene_reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_fused
