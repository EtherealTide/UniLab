# @package _global_
# WarpSAC MuJoCo owner for G1 whole-body tracking. It shares the FlashSAC task
# declaration and training budget for direct FastSAC/FlashSAC/WarpSAC curves.
defaults:
  - /task/g1_motion_tracking/base
  - _self_

training:
  task_name: G1MotionTrackingSAC
  sim_backend: mujoco
algo:
  num_envs: 2048
  max_iterations: 25000
  save_interval: 1000
  gamma: 0.99
  tau: 0.05
  updates_per_step: 4
  policy_frequency: 2
  # Uniform replay outperformed recent-biased profiles during 10.2M-step
  # mjwarp tuning and preserves coverage of the full motion clip history.
  decay_step: 0
  replay_min_weight: 0.05
