# @package _global_
# Production FlashSAC IsaacSim mapped CUDA IPC owner for G1 WBT.
# IsaacSim 5.1 / IsaacLab stays in the external Python 3.11 worker; this mapped
# entity scene opts into qpos/qvel/control and negotiated state/sensor views in
# a same-GPU CUDA IPC arena. The legacy raw-MJCF IsaacSim path remains
# TensorExecution.UNSUPPORTED because it has no mapped Manager-Based scene.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: G1MotionTrackingSAC
  sim_backend: isaacsim
  play_render_mode: auto
  # Reduce metric D2H frequency for the 2048-env tensor owner. Capacity remains
  # CLI-overridable, matching the MJWarp owner's measurement policy.
  collector_metrics_interval: 100
env:
  tensor_runtime: true
  isaacsim_device_id: 0
  isaacsim_worker_timeout_s: 300.0
  isaacsim_tensor_cuda_ipc: true
  # This DR-free owner does not use geom-friction reset randomization. Sharing
  # the equal initial native materials keeps 2048 clones below PhysX's material
  # budget while preserving authored friction semantics.
  isaacsim_share_friction_materials: true
  scene:
    # Mapped physical entities replace the raw MJCF model. The complete physical
    # G1 entity owns the named stand qpos/ctrl keyframe; SceneCfg initial_state
    # owns the mapped root pose.
    model_file: null
    primary_entity: robot
    entity_assets:
      - name: robot
        source:
          model_file: src/unilab/assets/robots/g1/isaacsim/g1_stand_entity.xml
        root_mode: floating
        initial_state:
          position: [0.0, 0.0, 0.754]
          quaternion: [1.0, 0.0, 0.0, 0.0]
      - name: floor
        source:
          model_file: src/unilab/assets/robots/g1/isaacsim/flat_floor_entity.xml
        kind: rigid
        root_mode: fixed
    entities:
      robot:
        root_body_name: robot/pelvis
        physical_entity: robot
        joint_names: &mapped_g1_joints
          - robot/left_hip_pitch_joint
          - robot/left_hip_roll_joint
          - robot/left_hip_yaw_joint
          - robot/left_knee_joint
          - robot/left_ankle_pitch_joint
          - robot/left_ankle_roll_joint
          - robot/right_hip_pitch_joint
          - robot/right_hip_roll_joint
          - robot/right_hip_yaw_joint
          - robot/right_knee_joint
          - robot/right_ankle_pitch_joint
          - robot/right_ankle_roll_joint
          - robot/waist_yaw_joint
          - robot/waist_roll_joint
          - robot/waist_pitch_joint
          - robot/left_shoulder_pitch_joint
          - robot/left_shoulder_roll_joint
          - robot/left_shoulder_yaw_joint
          - robot/left_elbow_joint
          - robot/left_wrist_roll_joint
          - robot/left_wrist_pitch_joint
          - robot/left_wrist_yaw_joint
          - robot/right_shoulder_pitch_joint
          - robot/right_shoulder_roll_joint
          - robot/right_shoulder_yaw_joint
          - robot/right_elbow_joint
          - robot/right_wrist_roll_joint
          - robot/right_wrist_pitch_joint
          - robot/right_wrist_yaw_joint
        actuator_names: *mapped_g1_joints
        body_names: &mapped_tracked_bodies
          - robot/pelvis
          - robot/left_hip_roll_link
          - robot/left_knee_link
          - robot/left_ankle_roll_link
          - robot/right_hip_roll_link
          - robot/right_knee_link
          - robot/right_ankle_roll_link
          - robot/torso_link
          - robot/left_shoulder_roll_link
          - robot/left_elbow_link
          - robot/left_wrist_yaw_link
          - robot/right_shoulder_roll_link
          - robot/right_elbow_link
          - robot/right_wrist_yaw_link
        geom_names: null
  observations:
    actor:
      terms:
        base_lin_vel:
          params:
            sensor_name: robot/pelvis_local_linvel
        base_ang_vel:
          params:
            sensor_name: robot/torso_gyro
    critic:
      terms:
        base_lin_vel:
          params:
            sensor_name: robot/pelvis_local_linvel
        base_ang_vel:
          params:
            sensor_name: robot/torso_gyro
        sac_base_lin_vel:
          params:
            sensor_name: robot/pelvis_local_linvel
  commands:
    motion:
      params:
        anchor_body_name: robot/torso_link
        body_names: *mapped_tracked_bodies
  terminations:
    ee_body_pos:
      params:
        body_names:
          - robot/left_ankle_roll_link
          - robot/right_ankle_roll_link
          - robot/left_wrist_yaw_link
          - robot/right_wrist_yaw_link

reward:
  undesired_contacts:
    params:
      body_names:
        - robot/pelvis
        - robot/left_hip_roll_link
        - robot/left_knee_link
        - robot/right_hip_roll_link
        - robot/right_knee_link
        - robot/torso_link
        - robot/left_shoulder_roll_link
        - robot/left_elbow_link
        - robot/right_shoulder_roll_link
        - robot/right_elbow_link
