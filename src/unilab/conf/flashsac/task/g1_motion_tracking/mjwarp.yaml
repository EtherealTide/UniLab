# @package _global_
# FlashSAC mjwarp (GPU) owner for G1 WBT. Inherits the FlashSAC MuJoCo owner
# verbatim so this phase-local tensor benchmark compares identical manager
# semantics across mjwarp and mjbatch; offline record reuses MuJoCo rendering.
# The shared base is intentionally DR-free because mjwarp's minimal tensor
# reset does not negotiate reset randomization or interval wrenches.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: G1MotionTrackingSAC
  sim_backend: mjwarp
  play_render_mode: record
