# @package _global_
# FlashSAC mjwarp (GPU) owner for G1 WBT. The command carrier, selected reset
# writes, and anchor observations stay on MJWarp's device-resident tensor path.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

reward:
  action_rate_l2: null
  joint_limit: null
  undesired_contacts: null
  motion_penalty_pack:
    _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionPenaltyRewardPackCfg
    func: unilab.tasks.motion_tracking.common.manager_terms.MotionPenaltyRewardPack
    weight: 1.0

training:
  task_name: G1MotionTrackingSAC
  sim_backend: mjwarp
  play_render_mode: record
  # Reduce metric D2H frequency for the scoped tensor benchmark; capacity
  # remains CLI-overridable so ring depth can be measured without task forks.
  collector_metrics_interval: 100
env:
  commands:
    motion:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.TensorMotionCommandCfg
  reset_owners:
    motion:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionResetOwnerCfg
      func: unilab.tasks.motion_tracking.common.manager_terms.MotionResetOwner
      command_name: motion
      action_name: joint_pos
      owns_command_reset: true
      owns_action_reset: true
      owns_observation_reset: true
      owns_metric_reset: true
  observations:
    actor:
      terms:
        command: null
        motion_anchor_pos_b: null
        motion_anchor_ori_b: null
        base_lin_vel: null
        base_ang_vel: null
        joint_pos: null
        joint_vel: null
        actions: null
        motion_anchor_pack:
          _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionObservationPackCfg
          func: unilab.tasks.motion_tracking.common.manager_terms.MotionObservationPack
          noise:
            _target_: unilab.managers._noise.SegmentwiseUniformNoiseCfg
