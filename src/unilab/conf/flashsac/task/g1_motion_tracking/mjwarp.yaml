# @package _global_
# FlashSAC mjwarp (GPU) owner for G1 WBT. The command carrier, selected reset
# writes, and anchor observations stay on MJWarp's device-resident tensor path.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: G1MotionTrackingSAC
  sim_backend: mjwarp
  play_render_mode: record
  # Reduce metric D2H frequency for the scoped tensor benchmark; capacity
  # remains CLI-overridable so ring depth can be measured without task forks.
  collector_metrics_interval: 100
env:
  commands:
    motion:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.TensorMotionCommandCfg
  observations:
    actor:
      terms:
        motion_anchor_pos_b: null
        motion_anchor_ori_b: null
        motion_anchor_pack:
          _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionAnchorObservationPackCfg
          func: unilab.tasks.motion_tracking.common.manager_terms.MotionAnchorObservationPack
    critic:
      terms:
        motion_anchor_pos_b: null
        motion_anchor_ori_b: null
        motion_anchor_pack:
          _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionAnchorObservationPackCfg
          func: unilab.tasks.motion_tracking.common.manager_terms.MotionAnchorObservationPack
