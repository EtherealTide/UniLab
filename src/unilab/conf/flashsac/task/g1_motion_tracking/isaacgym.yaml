# @package _global_
# Candidate FlashSAC IsaacGym tensor owner. Preview 4 stays in the external
# Python 3.8 worker; its GPU pipeline exposes qpos/qvel/control through the
# same-GPU CUDA IPC arena. Sensor and broader lifecycle support remain
# fail-closed until issue #1674 completes promotion evidence.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: G1MotionTrackingSAC
  sim_backend: isaacgym
  play_render_mode: auto
env:
  isaacgym_device_id: 0
  render_spacing: 2.0
  scene:
    entities:
      robot:
        geom_names: null
